# Chalk pull request gates, added by `chalk init` as .github/workflows/chalk.yml.
#
# Jobs run only on pull requests from Chalk branches. Make `chalk / spec` and
# `chalk / rubric` required status checks in a branch protection rule, and
# require an approving review: these jobs prove the gates passed, the
# approval records that a human reviewed the change.

name: chalk

on:
  pull_request:

permissions:
  contents: read

jobs:
  # No unfinished checkpoints may be merged, and governance files must exist.
  spec:
    if: startsWith(github.head_ref, 'chalk/') || startsWith(github.head_ref, 'tutoring/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the spec and governance files
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          TICKET=$(echo "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1)
          test -f CLAUDE.md
          test -f .chalk/textbook.md
          test -f "specs/$TICKET.md"
          if grep -nE '^[[:space:]]*- \[ \]' "specs/$TICKET.md"; then
            echo "specs/$TICKET.md has unfinished checkpoints"
            exit 1
          fi

  # Re-runs the rubric outside the agent's sandbox, with bash -c as the
  # sandbox does. This file is part of the pull request, so it cannot
  # protect itself: make a code owner's review required for .github/ and
  # .chalk/ (see "Pull and merge request gates" in the docs). For a stack
  # other than Node, set the repository variable
  # CHALK_CI_IMAGE to a registry image with your toolchain and bash.
  rubric:
    if: startsWith(github.head_ref, 'chalk/') || startsWith(github.head_ref, 'tutoring/')
    runs-on: ubuntu-latest
    container: ${{ vars.CHALK_CI_IMAGE || 'node:22' }}
    steps:
      - uses: actions/checkout@v4
      # The rubric is read from the base branch, so that a pull request
      # cannot rewrite the test it has to pass.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .chalk-base
          sparse-checkout: .chalk
      - name: Run the rubric
        run: |
          command -v bash >/dev/null || { echo "CHALK_CI_IMAGE needs bash: the rubric runs with bash -c, as in the sandbox"; exit 1; }
          CONFIG=$(cat .chalk-base/.chalk/config 2>/dev/null || { echo "the base branch has no .chalk/config, so the rubric is read from this branch" >&2; cat .chalk/config; })
          rm -rf .chalk-base
          SETUP_CMD=$(printf '%s\n' "$CONFIG" | sed -n 's/^CHALK_SETUP_CMD=//p')
          TEST_CMD=$(printf '%s\n' "$CONFIG" | sed -n 's/^CHALK_TEST_CMD=//p')
          test -n "$TEST_CMD"
          if [ -n "$SETUP_CMD" ]; then bash -c "$SETUP_CMD"; fi
          bash -c "$TEST_CMD"

  # Records that the gates passed. Runs only when the CHALK_AUDIT_DB_URL
  # secret is set. Table definition: share/ci-audit-schema.sql.
  audit:
    needs: [spec, rubric]
    runs-on: ubuntu-latest
    container: postgres:16-alpine
    env:
      CHALK_AUDIT_DB_URL: ${{ secrets.CHALK_AUDIT_DB_URL }}
      BRANCH: ${{ github.head_ref }}
      PROJECT: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Record the gates in the audit table
        if: env.CHALK_AUDIT_DB_URL != ''
        run: |
          TICKET=$(echo "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1)
          psql "$CHALK_AUDIT_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v project="$PROJECT" -v ticket="$TICKET" \
            -v mr="$PR" -v sha="$SHA" -v pipeline="$RUN_ID" <<'SQL'
          INSERT INTO chalk_audit (project, ticket, merge_request, commit_sha, pipeline_id, status)
          VALUES (:'project', :'ticket', :'mr', :'sha', :'pipeline', 'gates_passed');
          SQL

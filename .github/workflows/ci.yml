name: CI

on:
  push:
    branches: [main]
  pull_request:

# Chalk requires bash 5.3 on the host (docs/specs/bash-5.3.md). Every job
# puts it first on PATH with the setup-bash action before running anything.
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bash
      - uses: ./.github/actions/setup-shellcheck
      - run: make check lint-sandbox

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bash
      - run: make test

  # The same test with every SQL statement run against a real Postgres, on
  # the image Chalk runs (CHALK_DB_IMAGE in lib/db.sh).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chalk
          POSTGRES_PASSWORD: chalk
          POSTGRES_DB: chalk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chalk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bash
      - run: make test-db
        env:
          FAKE_PG_URL: postgresql://chalk:chalk@127.0.0.1:5432/chalk

  # A real Postgres 16 -> 17 upgrade with `chalk db upgrade`, against the
  # runner's Docker: rollback on two injected failures, then the upgrade
  # and its cleanup, with every row compared (issue #13).
  db-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bash
      - run: docker pull -q postgres:16-alpine && docker pull -q pgvector/pgvector:pg17
      - run: scripts/ci-db-upgrade.sh

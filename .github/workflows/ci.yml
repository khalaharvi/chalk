name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  # Chalk targets the bash 3.2 that ships with macOS.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash --version
      - run: PATH="/bin:/usr/bin:$PATH" make test

  # The same test with every SQL statement run against a real Postgres.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chalk
          POSTGRES_PASSWORD: chalk
          POSTGRES_DB: chalk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chalk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: make test-db
        env:
          FAKE_PG_URL: postgresql://chalk:chalk@127.0.0.1:5432/chalk

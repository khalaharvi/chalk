name: Set up ShellCheck
description: >
  Installs a pinned ShellCheck release, checked against its sha256. 0.11.0
  is verified to parse the bash 5.3 syntax Chalk uses, such as ${ cmd; }.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: "0.11.0"
        SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      run: |
        set -euo pipefail
        archive="shellcheck-v$VERSION.linux.x86_64.tar.xz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/koalaman/shellcheck/releases/download/v$VERSION/$archive"
        echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/shellcheck-v$VERSION" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/shellcheck-v$VERSION/shellcheck" --version
